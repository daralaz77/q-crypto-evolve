[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "q-crypto-evolve"
version = "0.1.0"
description = "Laboratorio de criptografía poscuántica híbrida con QKD (ETSI GS QKD 014) y puente TLS 1.3 con PSK. Sin revisión humana externa; no usar en producción."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Darwing John Pérez Aranguren" }]
dependencies = ["cryptography==50.0.2"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Security :: Cryptography",
]

[project.urls]
Repository = "https://github.com/daralaz77/q-crypto-evolve"

[project.scripts]
qce-kme = "qce_kme:main"
qce = "qce.cli:main"

[tool.setuptools]
py-modules = ["qce_kme"]

[tool.setuptools.packages.find]
include = ["qce*"]
