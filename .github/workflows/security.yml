name: Seguridad (CodeQL, Scorecard, zizmor, procedencia)

# Análisis y atestaciones fuera del release_id. No usa secretos propios; los permisos están acotados por trabajo.
# Scorecard NO publica resultados (publish_results: false). La procedencia solo se genera a demanda (workflow_dispatch).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 6 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (Python)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: python
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: scorecard.sarif
          category: scorecard

  zizmor:
    name: zizmor (análisis de los flujos de trabajo)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: zizmor (versión fijada)
        run: |
          python -m pip install --quiet zizmor==1.31.1
          zizmor --no-online-audits --format plain .github/workflows

  provenance:
    name: Procedencia firmada del paquete y de la CBOM
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Construir el paquete fuente (versión de build fijada)
        run: |
          python -m pip install --quiet build==1.6.1
          python -m build --sdist --outdir dist
          cp benchmarks/cbom.cdx.json benchmarks/gates_latest.json dist/
          ls -la dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - name: Verificar la atestación de cada archivo (sdist, CBOM, informe de puertas)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in dist/*; do
            echo "== $f"
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY"
          done
